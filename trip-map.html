<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trip Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', sans-serif; background: #1a1a2e; color: #eee; }
    header {
      padding: 16px 24px;
      background: #16213e;
      border-bottom: 2px solid #e94560;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    header h1 { font-size: 1.4rem; color: #e94560; letter-spacing: 1px; }
    header span { font-size: 0.9rem; color: #aaa; }
    #map { height: calc(100vh - 56px); width: 100%; }
    .legend {
      background: rgba(22, 33, 62, 0.95);
      border: 1px solid #e94560;
      border-radius: 8px;
      padding: 12px 16px;
      min-width: 180px;
    }
    .legend h4 { color: #e94560; margin-bottom: 8px; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; }
    .legend-item { display: flex; align-items: center; gap: 8px; margin: 4px 0; font-size: 0.8rem; color: #ccc; }
    .legend-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
    .stop-num {
      display: inline-flex; align-items: center; justify-content: center;
      width: 22px; height: 22px; border-radius: 50%;
      background: #e94560; color: #fff;
      font-size: 11px; font-weight: bold; flex-shrink: 0;
    }
  </style>
</head>
<body>
  <header>
    <h1>Trip Map</h1>
    <span>11 cities &bull; 4 continents</span>
  </header>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const cities = [
      { name: "San Francisco",  country: "USA",       coords: [37.7749, -122.4194] },
      { name: "Las Vegas",      country: "USA",       coords: [36.1699, -115.1398] },
      { name: "San Antonio",    country: "USA",       coords: [29.4241,  -98.4936] },
      { name: "Montreal",       country: "Canada",    coords: [45.5017,  -73.5673] },
      { name: "Rio de Janeiro", country: "Brazil",    coords: [-22.9068, -43.1729] },
      { name: "Basel",          country: "Switzerland", coords: [47.5596,   7.5886] },
      { name: "Valencia",       country: "Spain",     coords: [39.4699,   -0.3763] },
      { name: "Palermo",        country: "Italy",     coords: [38.1157,   13.3615] },
      { name: "Edinburgh",      country: "Scotland",  coords: [55.9533,   -3.1883] },
      { name: "Glasgow",        country: "Scotland",  coords: [55.8642,   -4.2518] },
      { name: "Istanbul",       country: "Turkey",    coords: [41.0082,   28.9784] },
    ];

    const map = L.map('map', {
      center: [30, -20],
      zoom: 3,
      zoomControl: true,
    });

    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/">CARTO</a>',
      maxZoom: 19,
    }).addTo(map);

    // Draw route line
    const latlngs = cities.map(c => c.coords);
    L.polyline(latlngs, {
      color: '#e94560',
      weight: 2.5,
      opacity: 0.7,
      dashArray: '8, 6',
    }).addTo(map);

    // Custom numbered icon
    function makeIcon(n) {
      return L.divIcon({
        className: '',
        html: `<div style="
          width:28px;height:28px;border-radius:50%;
          background:#e94560;border:2px solid #fff;
          color:#fff;font-size:12px;font-weight:bold;
          display:flex;align-items:center;justify-content:center;
          box-shadow:0 2px 6px rgba(0,0,0,0.5);
        ">${n}</div>`,
        iconSize: [28, 28],
        iconAnchor: [14, 14],
        popupAnchor: [0, -16],
      });
    }

    cities.forEach((city, i) => {
      L.marker(city.coords, { icon: makeIcon(i + 1) })
        .addTo(map)
        .bindPopup(`
          <div style="font-family:'Segoe UI',sans-serif;min-width:130px;">
            <div style="font-size:1rem;font-weight:bold;color:#e94560">Stop ${i + 1}</div>
            <div style="font-size:1.1rem;font-weight:600;margin:2px 0">${city.name}</div>
            <div style="font-size:0.85rem;color:#888">${city.country}</div>
          </div>
        `);
    });

    // Legend control
    const legend = L.control({ position: 'bottomright' });
    legend.onAdd = () => {
      const div = L.DomUtil.create('div', 'legend');
      div.innerHTML = '<h4>Stops</h4>' + cities.map((c, i) =>
        `<div class="legend-item">
          <span class="stop-num">${i + 1}</span>
          <span>${c.name}</span>
        </div>`
      ).join('');
      return div;
    };
    legend.addTo(map);
  </script>
</body>
</html>
